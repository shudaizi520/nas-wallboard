<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=1">
  <link rel="stylesheet" href="/admin.css?v=1">
  <title>登录 NAS Wallboard</title>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand login-brand" href="/">
        <img src="/icon.svg?v=1" alt="">
        <span><strong>NAS Wallboard</strong><small>本地管理</small></span>
      </a>
      <h1 id="login-title">欢迎回来</h1>
      <p class="lead">登录后可以管理集成、桌面布局和应用设置。</p>
      <form id="login-form">
        <div class="field">
          <label for="login-username">管理员用户名</label>
          <input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
        </div>
        <div class="field">
          <label for="login-password">管理员密码</label>
          <input id="login-password" type="password" autocomplete="current-password">
        </div>
        <button id="login-submit" class="primary" type="submit">登录</button>
        <p id="login-status" role="alert" aria-live="polite"></p>
      </form>
      <a class="back-link" href="/">返回只读桌面</a>
    </section>
  </main>
  <script type="module" src="/login.js?v=1"></script>
</body>
</html>
