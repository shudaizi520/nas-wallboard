<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=1">
  <link rel="stylesheet" href="/styles.css?v=44">
  <title>NAS Wallboard</title>
</head>
<body>
  <main class="wallpaper">
    <section class="glass-panel" aria-label="NAS 状态">
      <a class="setup-required" data-bind="setup-required" href="/setup" hidden>
        <strong>完成初始设置</strong>
        <span>连接 TrueNAS 后开始显示状态</span>
      </a>
      <header class="health-strip">
        <div class="nas-summary">
          <span class="nas-mark">
            <i class="connection-dot" data-bind="connection" data-tone="bad" aria-hidden="true"></i>
            <b>NAS</b>
          </span>
          <span class="nas-meta">
            <span class="nas-freshness" data-bind="freshness" role="status" hidden></span>
            <span class="nas-uptime" data-bind="uptime" hidden></span>
            <span class="nas-power" data-bind="nas-power" hidden></span>
          </span>
        </div>
        <div class="health-metrics" data-list="metrics"></div>
      </header>

      <div class="activity-list" data-list="activities" aria-live="polite"></div>
    </section>
  </main>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-cpu" viewBox="0 0 24 24">

      <path d="M7 15h10M8 17h.01M16 17h.01"></path>
    </symbol>
    <symbol id="icon-network" viewBox="0 0 24 24">
      <path d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"></path>
    </symbol>
    <symbol id="icon-weather-sunny" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.1" fill="currentColor" stroke="none"></circle>

    </symbol>
    <symbol id="icon-weather-moon" viewBox="0 0 24 24">

    <symbol id="icon-weather-overcast" viewBox="0 0 24 24">

    <symbol id="icon-weather-unknown" viewBox="0 0 24 24">
      <!-- No invented phenomenon or question mark for unavailable data. -->

    <symbol id="icon-fan" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.25"></circle>
      <g fill="currentColor" stroke="none">
